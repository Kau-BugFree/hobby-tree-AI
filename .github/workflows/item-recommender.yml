name: Item recommender
on:
  push:
    paths: ['src/item-recommender/**', '.github/workflows/item-recommender.yml']
  pull_request:
    paths: ['src/item-recommender/**', '.github/workflows/item-recommender.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_PASSWORD: catalog_test_only
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_test -d catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CATALOG_TEST_DATABASE_URL: postgresql://catalog_test:catalog_test_only@127.0.0.1:5432/catalog_test
    defaults:
      run:
        working-directory: src/item-recommender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e '.[postgres]'
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/smoke_local.py
